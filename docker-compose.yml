services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: metadiet
      POSTGRES_USER: meta
      POSTGRES_PASSWORD: meta
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meta"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application -b 0.0.0.0:8000"
    volumes: ["./backend:/app"]
    env_file: ["./backend/.env"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["8000:8000"]
  celery:
    build: ./backend
    command: celery -A config worker -l info
    volumes: ["./backend:/app"]
    env_file: ["./backend/.env"]
    depends_on: [backend]
  frontend:
    build: ./frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes: ["./frontend:/app"]
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports: ["5173:5173"]
