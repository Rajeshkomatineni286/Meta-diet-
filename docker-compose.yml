services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: metadiet
      POSTGRES_USER: meta
      POSTGRES_PASSWORD: meta
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  backend:
    build: ./backend
    command: gunicorn config.wsgi:application -b 0.0.0.0:8000
    volumes: ["./backend:/app"]
    env_file: ["./backend/.env"]
    depends_on: [db, redis]
    ports: ["8000:8000"]
  celery:
    build: ./backend
    command: celery -A config worker -l info
    volumes: ["./backend:/app"]
    env_file: ["./backend/.env"]
    depends_on: [backend, redis]
  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes: ["./frontend:/app"]
    ports: ["5173:5173"]
